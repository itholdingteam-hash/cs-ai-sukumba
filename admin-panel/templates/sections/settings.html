      <!-- SETTINGS -->
      <div class="section" id="section-settings">
        <div class="settings-section">
          <div class="settings-title">&#x1F3E2; Informasi Perusahaan</div>
          <div class="grid-2">
            <div class="form-row"><label class="label">Nama Perusahaan</label><input class="input" id="s-name"></div>
            <div class="form-row"><label class="label">Kontak WA</label><input class="input" id="s-contact"></div>
            <div class="form-row"><label class="label">Lokasi</label><input class="input" id="s-location"></div>
            <div class="form-row"><label class="label">Jam Operasional</label><input class="input" id="s-hours"></div>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-title">&#x1F916; AI Engine</div>
          <div class="grid-2">
            <div class="form-row"><label class="label">Provider</label>
              <select class="select" id="s-provider">
                <option value="openrouter">OpenRouter</option>
                <option value="groq">Groq</option>
                <option value="openai">OpenAI Compatible</option>
                <option value="local">Local LLM</option>
              </select>
            </div>
            <div class="form-row"><label class="label">API URL</label><input class="input" id="s-api-url" placeholder="https://openrouter.ai/api/v1/chat/completions"></div>
            <div class="form-row"><label class="label">Model AI</label>
              <input class="input" id="s-model" list="model-options" placeholder="qwen/qwen3-32b:free">
              <datalist id="model-options">
                <option value="qwen/qwen3-32b:free">
                <option value="meta-llama/llama-3.3-70b-instruct:free">
                <option value="deepseek/deepseek-v4-flash:free">
                <option value="openrouter/free">
                <option value="openai/gpt-5.4-mini">
                <option value="anthropic/claude-haiku-4.5">
                <option value="llama-3.3-70b-versatile">
                <option value="llama-3.1-8b-instant">
              </datalist>
            </div>
            <div class="form-row"><label class="label">API Key</label><input class="input" id="s-apikey" type="password" placeholder="OpenRouter/Groq/OpenAI key"></div>
            <div class="form-row"><label class="label">Temperature (0&ndash;1)</label><input class="input" id="s-temp" type="number" step="0.1" min="0" max="1"></div>
            <div class="form-row"><label class="label">Max Tokens</label><input class="input" id="s-tokens" type="number" min="100" max="2000"></div>
          </div>
          <button class="btn btn-primary" onclick="saveSettings()">&#x1F4BE; Simpan Pengaturan</button>
        </div>
        <div class="settings-section">
          <div class="settings-title">&#x2708;&#xFE0F; Telegram Bot</div>
          <div class="grid-2">
            <div class="form-row"><label class="label">Bot Token</label><input class="input" id="s-tg-token" type="password" placeholder="123456:AAxxxx"></div>
            <div class="form-row" style="display:flex;align-items:flex-end"><button class="btn btn-ghost" onclick="setTelegramWebhook()" style="width:100%">&#x1F517; Atur Webhook</button></div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="saveTgToken()">&#x1F4BE; Simpan Token</button>
        </div>
        <div class="settings-section">
          <div class="settings-title">&#x1F9EA; Testing Memory</div>
          <div class="grid-2">
            <div class="form-row"><label class="label">Nomor WA Customer</label><input class="input" id="reset-memory-number" placeholder="62812xxxx"></div>
            <div class="form-row" style="display:flex;align-items:flex-end;gap:8px">
              <button class="btn btn-ghost" onclick="checkCustomerMemory()" style="flex:1">Cek Memory</button>
              <button class="btn btn-danger" onclick="resetCustomerMemory()" style="flex:1">Reset</button>
            </div>
          </div>
          <div id="memory-reset-result" style="font-size:12px;color:var(--text2);line-height:1.5"></div>
        </div>
        <div class="settings-section">
          <div class="settings-title"><span>&#x1F465; Telegram Whitelist</span><button class="btn btn-primary btn-sm" onclick="openAddTgUser()">&#x2795; Tambah</button></div>
          <div id="tg-users-list"></div>
        </div>
      </div>
