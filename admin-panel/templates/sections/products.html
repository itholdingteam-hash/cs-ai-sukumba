<!-- PRODUCTS -->
<div class="section" id="section-products">
  <div class="kb-hero" style="display: flex; justify-content: space-between; align-items: center; background: #1e1e24; padding: 24px; border-radius: 12px; border: 1px solid #333;">
    <div style="flex: 1;">
      <div class="kb-kicker" style="color: #10b981; font-size: 12px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px;">Baseline CS AI</div>
      <div class="kb-title" style="color: #fff; font-size: 20px; font-weight: 600; margin-bottom: 8px;">Produk Dasar Jawaban</div>
      <div class="kb-copy" style="color: #9ca3af; font-size: 14px; line-height: 1.5; max-width: 500px;">Data produk dipakai saat pelanggan tanya manfaat, harga, promo, cara konsumsi, keluhan, rekomendasi.</div>
    </div>
    <div class="kb-stats" style="display: flex; gap: 24px;">
      <div class="kb-stat" style="background: #27272a; padding: 16px; border-radius: 8px; text-align: center; min-width: 100px; border: 1px solid #3f3f46;">
        <div class="kb-stat-value" id="products-count" style="font-size: 28px; font-weight: bold; color: #fff;">0</div>
        <div class="kb-stat-label" style="font-size: 12px; color: #9ca3af; margin-top: 4px;">Produk Aktif</div>
      </div>
      <div class="kb-stat" style="background: #27272a; padding: 16px; border-radius: 8px; text-align: center; min-width: 100px; border: 1px solid #3f3f46;">
        <div class="kb-stat-value" id="features-count" style="font-size: 28px; font-weight: bold; color: #fff;">0</div>
        <div class="kb-stat-label" style="font-size: 12px; color: #9ca3af; margin-top: 4px;">Poin Manfaat</div>
      </div>
      <button class="btn btn-primary" type="button" onclick="openProductModal()">&#x2795; Tambah Produk</button>
    </div>
  </div>
  
  <div id="products-list" class="kb-list" style="margin-top: 24px;"></div>
  
  <div class="empty" id="products-empty" style="display:none; text-align: center; padding: 48px; background: #1e1e24; border-radius: 12px; margin-top: 24px; border: 1px dashed #444;">
    <div class="empty-icon" style="font-size: 48px; opacity: 0.5; margin-bottom: 16px;">&#x1F4E6;</div>
    <div class="empty-text" style="color: #9ca3af; font-size: 16px;">Belum ada produk.</div>
  </div>
</div>
