<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login Admin - TukugawaNet</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-slate-100">
    <main class="flex min-h-screen items-center justify-center px-4 py-8">
      <div class="w-full max-w-md">
        <!-- Branding -->
        <div class="mb-6 text-center">
          <div
            class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-600 shadow-lg shadow-blue-200"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              class="h-7 w-7 text-white"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5 12.55a11 11 0 0 1 14.08 0M8.5 16a6 6 0 0 1 7 0M12 20h.01"
              />
            </svg>
          </div>

          <h1 class="text-2xl font-bold text-slate-900 sm:text-3xl">
            Selamat datang
          </h1>

          <p class="mt-2 text-sm text-slate-500">
            Masuk ke Admin Panel TukugawaNet
          </p>
        </div>

        <!-- Login Card -->
        <section
          class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8"
        >
          {% if error %}
          <div
            role="alert"
            class="mb-5 flex items-start gap-3 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              class="mt-0.5 h-5 w-5 shrink-0"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 8v4"></path>
              <path d="M12 16h.01"></path>
            </svg>

            <span>{{ error }}</span>
          </div>
          {% endif %}

          <form method="POST" id="loginForm">
            <div>
              <label
                for="password"
                class="mb-2 block text-sm font-semibold text-slate-700"
              >
                Password
              </label>

              <div class="relative">
                <div
                  class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    class="h-5 w-5 text-slate-400"
                  >
                    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </div>

                <input
                  id="password"
                  type="password"
                  name="password"
                  required
                  autocomplete="current-password"
                  placeholder="Masukkan password"
                  class="w-full rounded-xl border border-slate-300 bg-white py-3 pl-11 pr-12 text-base text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
                />

                <button
                  type="button"
                  id="togglePassword"
                  aria-label="Tampilkan password"
                  class="absolute inset-y-0 right-0 flex items-center rounded-r-xl px-4 text-slate-400 transition hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500"
                >
                  <svg
                    id="eyeOpen"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    class="h-5 w-5"
                  >
                    <path
                      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>

                  <svg
                    id="eyeClosed"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    class="hidden h-5 w-5"
                  >
                    <path d="m3 3 18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path
                      d="M9.9 4.2A10.7 10.7 0 0 1 12 4c6.5 0 10 8 10 8a18 18 0 0 1-3 4.3"
                    ></path>
                    <path
                      d="M6.6 6.6C3.7 8.6 2 12 2 12s3.5 8 10 8a10.6 10.6 0 0 0 4.1-.8"
                    ></path>
                  </svg>
                </button>
              </div>

              <p class="mt-2 text-xs text-slate-500">
                Pastikan password dimasukkan dengan benar.
              </p>
            </div>

            <button
              type="submit"
              id="loginButton"
              class="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200 disabled:cursor-not-allowed disabled:bg-blue-400"
            >
              <svg
                id="loadingIcon"
                class="hidden h-5 w-5 animate-spin"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>

                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4z"
                ></path>
              </svg>

              <span id="loginButtonText">Masuk</span>
            </button>
          </form>
        </section>

        <p class="mt-6 text-center text-xs text-slate-500">
          © <span id="current-year"></span> TukugawaNet.
        </p>
      </div>
    </main>

    <script>
      const passwordInput = document.getElementById("password");
      const togglePassword = document.getElementById("togglePassword");
      const eyeOpen = document.getElementById("eyeOpen");
      const eyeClosed = document.getElementById("eyeClosed");

      const loginForm = document.getElementById("loginForm");
      const loginButton = document.getElementById("loginButton");
      const loginButtonText = document.getElementById("loginButtonText");
      const loadingIcon = document.getElementById("loadingIcon");

      togglePassword.addEventListener("click", function () {
        const passwordVisible = passwordInput.type === "text";

        passwordInput.type = passwordVisible ? "password" : "text";

        eyeOpen.classList.toggle("hidden", !passwordVisible);
        eyeClosed.classList.toggle("hidden", passwordVisible);

        togglePassword.setAttribute(
          "aria-label",
          passwordVisible ? "Tampilkan password" : "Sembunyikan password",
        );

        passwordInput.focus();
      });

      loginForm.addEventListener("submit", function () {
        loginButton.disabled = true;
        loadingIcon.classList.remove("hidden");
        loginButtonText.textContent = "Memproses...";
      });

      document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
